<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🎓 Student Information Portal</h1>
            <p>Enter your full name to view your profile:</p>
        </header>

        <!-- Search Form -->
        <div class="form-group">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="e.g., Yasser Zriouh" required>
            <button onclick="getStudentInfo()">Search</button>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="result-card hidden">
            <h2 id="studentTitle"></h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Age:</span>
                    <span id="studentAge" class="value"></span>
                </div>
                <div class="info-item">
                    <span class="label">Class:</span>
                    <span id="studentClass" class="value"></span>
                </div>
                <div class="info-item">
                    <span class="label">Grade:</span>
                    <span id="studentGrade" class="value highlight"></span>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-card hidden">
            ⚠️ Student not found. Please make sure the name is spelled correctly (e.g., Anas Dali).
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
