<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <!-- Tailwind CSS CDN & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f4c81 0%, #1b365d 50%, #0d253f 100%);
        }
        .custom-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Top Navigation Header -->
    <header class="w-full py-5 px-8 flex justify-between items-center bg-white/5 backdrop-blur-md border-b border-white/10">
        <div class="flex items-center gap-3 text-white">
            <div class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-400/30 flex items-center justify-center text-cyan-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <span class="font-bold text-lg tracking-wide">Student Portal</span>
        </div>
        <div class="text-xs text-cyan-200/80 bg-white/5 px-4 py-2 rounded-full border border-white/10">
            System Active
        </div>
    </header>

    <!-- Main Content Center -->
    <main class="flex-grow flex flex-col items-center justify-center p-6">
        
        <!-- Title Section -->
        <div class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight mb-2">
                Student Information
            </h1>
            <p class="text-cyan-200/80 text-sm font-light tracking-wider">
                Search for a student
            </p>
        </div>

        <!-- The Original Card with Enhancements -->
        <div class="w-full max-w-lg custom-card rounded-3xl p-8 shadow-2xl border border-white/20">
            <form action="/" method="GET" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Student Name</label>
                    <input 
                        type="text" 
                        name="query" 
                        placeholder="Enter full name..." 
                        class="w-full px-5 py-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white transition-all text-sm shadow-inner"
                        required
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="w-full py-4 bg-cyan-400 hover:bg-cyan-500 text-slate-900 font-bold rounded-xl transition-all shadow-lg shadow-cyan-500/30 flex items-center justify-center gap-2 text-sm tracking-wider uppercase"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    SEARCH
                </button>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-cyan-200/50">
        <p>&copy; 2026 Student Information System. All rights reserved.</p>
    </footer>

</body>
</html>
